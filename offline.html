<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير متصل - Python Zone v3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f4f8;
            font-family: 'Inter', sans-serif;
            text-align: center;
            padding: 1.5rem;
        }
        .offline-container {
            background: white;
            padding: 3rem 2rem;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
            max-width: 420px;
            border: 1px solid rgba(0,0,0,0.02);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .offline-icon { 
            font-size: 4rem; 
            margin-bottom: 0.5rem;
            animation: bounce 2s ease-in-out infinite;
        }
        h1 { 
            color: #0f172a; 
            font-size: 1.5rem; 
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        h1 i { color: #2563eb; }
        p { 
            color: #64748b; 
            font-size: 0.9rem; 
            line-height: 1.6; 
        }
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin: 1rem 0;
        }
        .features .feature-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 0.6rem;
            font-size: 0.65rem;
            color: #475569;
            border: 1px solid #e2e8f0;
        }
        .features .feature-item i {
            color: #2563eb;
            display: block;
            font-size: 1.2rem;
            margin-bottom: 0.2rem;
        }
        .retry-btn {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .retry-btn:hover { 
            transform: scale(1.02); 
            box-shadow: 0 8px 25px rgba(37,99,235,0.15);
        }
        .retry-btn:active { transform: scale(0.98); }
        .brand { 
            margin-top: 1rem; 
            color: #94a3b8; 
            font-size: 0.75rem; 
        }
        .brand strong { 
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand .version {
            display: block;
            font-size: 0.6rem;
            margin-top: 0.2rem;
            color: #cbd5e1;
            -webkit-text-fill-color: #cbd5e1;
        }
        .status-dots {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin: 0.5rem 0;
        }
        .status-dots .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e2e8f0;
        }
        .status-dots .dot.active {
            background: #22c55e;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        @media (max-width: 400px) {
            .features { grid-template-columns: 1fr 1fr; }
            .offline-container { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1><i class="fas fa-wifi"></i> غير متصل بالإنترنت</h1>
        <p>الرجاء التحقق من اتصالك بالشبكة<br>التطبيق سيعمل تلقائياً عند العودة</p>
        
        <div class="status-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
        
        <div class="features">
            <div class="feature-item">
                <i class="fas fa-shield-alt"></i>
                2FA جاهز
            </div>
            <div class="feature-item">
                <i class="fas fa-robot"></i>
                AI مساعد
            </div>
            <div class="feature-item">
                <i class="fas fa-ticket-alt"></i>
                تذاكر
            </div>
            <div class="feature-item">
                <i class="fas fa-palette"></i>
                ثيمات
            </div>
        </div>
        
        <button class="retry-btn" onclick="location.reload()">
            <i class="fas fa-sync-alt"></i> إعادة المحاولة
        </button>
        
        <div class="brand">
            🐍 <strong>Python Zone</strong> v3.0
            <span class="version">@TopVeGa • 2026</span>
        </div>
    </div>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</body>
</html>

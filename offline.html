<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير متصل - Python Zone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f4f8;
            font-family: 'Inter', sans-serif;
            text-align: center;
            padding: 1.5rem;
        }
        .offline-container {
            background: white;
            padding: 3rem 2rem;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
            max-width: 400px;
            border: 1px solid rgba(0,0,0,0.02);
        }
        .offline-icon { font-size: 4rem; margin-bottom: 0.5rem; }
        h1 { color: #0f172a; font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #64748b; font-size: 0.9rem; line-height: 1.6; }
        .retry-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .retry-btn:hover { background: #1d4ed8; transform: scale(1.02); }
        .brand { margin-top: 1rem; color: #94a3b8; font-size: 0.75rem; }
        .brand strong { color: #2563eb; }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>🔄 غير متصل بالإنترنت</h1>
        <p>الرجاء التحقق من اتصالك بالشبكة<br>التطبيق سيعمل تلقائياً عند العودة</p>
        <button class="retry-btn" onclick="location.reload()">🔄 إعادة المحاولة</button>
        <div class="brand">🐍 <strong>Python Zone</strong> • @TopVeGa</div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Py Zone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            min-height: 100vh;
            background: #f0f4f8;
            padding: 1rem;
            transition: background 0.5s ease;
        }
        body.dark-mode {
            background: #0a0510;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .glass {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }
        body.dark-mode .glass {
            background: rgba(20, 10, 30, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(180, 100, 255, 0.15);
            box-shadow: 0 8px 32px rgba(120, 40, 200, 0.15);
        }
        /* ===== HEADER ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            gap: 0.5rem;
        }
        body.dark-mode .header {
            border-color: rgba(255, 255, 255, 0.05);
        }
        .brand h1 {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #1e293b, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body.dark-mode .brand h1 {
            background: linear-gradient(135deg, #f1f5f9, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand small {
            font-size: 0.7rem;
            color: #64748b;
            display: block;
        }
        body.dark-mode .brand small {
            color: #94a3b8;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-icon {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: none;
            padding: 0.4rem 0.9rem;
            border-radius: 60px;
            color: #1e293b;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        body.dark-mode .btn-icon {
            background: rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
        }
        .btn-icon i {
            color: #7c3aed;
        }
        body.dark-mode .btn-icon i {
            color: #a78bfa;
        }
        .btn-icon:hover {
            transform: translateY(-2px);
            background: rgba(124, 58, 237, 0.06);
        }
        /* ===== NAV ===== */
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.4rem;
            margin: 1.2rem 0;
        }
        .nav-btn {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.03);
            padding: 0.4rem 1.4rem;
            border-radius: 60px;
            color: #1e293b;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        body.dark-mode .nav-btn {
            background: rgba(255, 255, 255, 0.03);
            color: #e2e8f0;
        }
        .nav-btn i {
            color: #7c3aed;
        }
        body.dark-mode .nav-btn i {
            color: #a78bfa;
        }
        .nav-btn:hover {
            transform: translateY(-3px);
            background: rgba(241, 245, 249, 0.7);
        }
        body.dark-mode .nav-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .nav-btn.active {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: #fff;
        }
        body.dark-mode .nav-btn.active {
            background: linear-gradient(135deg, #a78bfa, #c4b5fd);
            color: #0a0510;
        }
        .nav-btn.active i {
            color: #fff;
        }
        body.dark-mode .nav-btn.active i {
            color: #0a0510;
        }
        /* ===== CATEGORIES ===== */
        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1rem 0;
            padding: 0.8rem 1.2rem;
            border-radius: 28px;
        }
        .category-tag {
            padding: 0.2rem 1rem;
            border-radius: 60px;
            font-size: 0.75rem;
            background: rgba(241, 245, 249, 0.5);
            color: #1e293b;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }
        body.dark-mode .category-tag {
            background: rgba(255, 255, 255, 0.02);
            color: #e2e8f0;
        }
        .category-tag:hover,
        .category-tag.active {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: #fff;
            transform: translateY(-2px);
        }
        body.dark-mode .category-tag:hover,
        body.dark-mode .category-tag.active {
            background: linear-gradient(135deg, #a78bfa, #c4b5fd);
            color: #0a0510;
        }
        /* ===== CONTENT ===== */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
            margin: 1.2rem 0;
        }
        .content-card {
            border-radius: 24px;
            padding: 1.2rem;
            border: 1px solid rgba(0, 0, 0, 0.02);
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            position: relative;
        }
        .content-card:hover {
            transform: translateY(-6px);
            border-color: rgba(124, 58, 237, 0.05);
        }
        .content-card .card-icon {
            font-size: 2rem;
            color: #7c3aed;
            margin-bottom: 0.5rem;
        }
        body.dark-mode .content-card .card-icon {
            color: #a78bfa;
        }
        .content-card .card-title {
            font-weight: 700;
            color: #0f172a;
            font-size: 1rem;
        }
        body.dark-mode .content-card .card-title {
            color: #f1f5f9;
        }
        .content-card .card-desc {
            color: #64748b;
            font-size: 0.8rem;
            margin: 0.3rem 0;
        }
        body.dark-mode .content-card .card-desc {
            color: #94a3b8;
        }
        .content-card .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }
        .content-card .card-actions button {
            padding: 0.2rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(0, 0, 0, 0.02);
            background: rgba(248, 250, 252, 0.5);
            color: #1e293b;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        body.dark-mode .content-card .card-actions button {
            background: rgba(255, 255, 255, 0.02);
            color: #e2e8f0;
        }
        .content-card .card-actions button:hover {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: #fff;
            transform: translateY(-2px);
        }
        /* ===== PRICING ===== */
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .pricing-card {
            border-radius: 20px;
            padding: 1.2rem 1rem;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .pricing-card:hover {
            transform: translateY(-6px);
            border-color: rgba(124, 58, 237, 0.05);
        }
        .pricing-card.popular {
            border-color: #7c3aed;
            background: rgba(124, 58, 237, 0.02);
        }
        body.dark-mode .pricing-card.popular {
            border-color: #a78bfa;
            background: rgba(167, 139, 250, 0.02);
        }
        .pricing-card .pricing-name {
            font-weight: 700;
            color: #0f172a;
        }
        body.dark-mode .pricing-card .pricing-name {
            color: #f1f5f9;
        }
        .pricing-card .pricing-price {
            font-size: 1.6rem;
            font-weight: 900;
            color: #7c3aed;
            margin: 0.3rem 0;
        }
        body.dark-mode .pricing-card .pricing-price {
            color: #a78bfa;
        }
        .pricing-card .pricing-btn {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            border: none;
            padding: 0.4rem 1.5rem;
            border-radius: 60px;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.4rem;
        }
        .pricing-card .pricing-btn:hover {
            transform: scale(1.04);
        }
        body.dark-mode .pricing-card .pricing-btn {
            background: linear-gradient(135deg, #a78bfa, #c4b5fd);
            color: #0a0510;
        }
        /* ===== API ===== */
        .api-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.8rem;
            margin-top: 0.8rem;
        }
        .api-card {
            background: rgba(248, 250, 252, 0.4);
            backdrop-filter: blur(6px);
            border-radius: 20px;
            padding: 1rem 0.8rem;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.02);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        body.dark-mode .api-card {
            background: rgba(255, 255, 255, 0.02);
        }
        .api-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.08);
        }
        .api-card i {
            font-size: 1.6rem;
            color: #7c3aed;
            display: block;
            margin-bottom: 0.3rem;
        }
        body.dark-mode .api-card i {
            color: #a78bfa;
        }
        .api-card .api-name {
            font-weight: 600;
            color: #0f172a;
        }
        body.dark-mode .api-card .api-name {
            color: #f1f5f9;
        }
        .api-card .api-desc {
            font-size: 0.7rem;
            color: #64748b;
        }
        body.dark-mode .api-card .api-desc {
            color: #94a3b8;
        }
        /* ===== FOOTER ===== */
        .footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.8rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(0, 0, 0, 0.02);
            color: #64748b;
            font-size: 0.8rem;
        }
        body.dark-mode .footer {
            border-color: rgba(255, 255, 255, 0.02);
            color: #94a3b8;
        }
        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-height: 90vh;
            overflow-y: auto;
        }
        body.dark-mode .modal {
            background: rgba(20, 10, 30, 0.9);
            border-color: rgba(180, 100, 255, 0.1);
        }
        .modal .close-modal {
            float: left;
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #64748b;
        }
        .modal h2 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: #0f172a;
        }
        body.dark-mode .modal h2 {
            color: #f1f5f9;
        }
        .modal h2 i {
            color: #7c3aed;
        }
        body.dark-mode .modal h2 i {
            color: #a78bfa;
        }
        .toast {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(16px);
            color: #fff;
            padding: 0.8rem 1.5rem;
            border-radius: 16px;
            font-size: 0.9rem;
            z-index: 9999;
            animation: slideUp 0.3s ease;
            direction: rtl;
            max-width: 90%;
        }
        body.dark-mode .toast {
            background: rgba(20, 10, 30, 0.95);
        }
        .toast.hide {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .glass {
                padding: 1rem;
                border-radius: 28px;
            }
            .brand h1 {
                font-size: 1.2rem;
            }
            .header-actions {
                width: 100%;
                justify-content: center;
            }
            .btn-icon {
                font-size: 0.7rem;
                padding: 0.2rem 0.6rem;
            }
            .content-grid {
                grid-template-columns: 1fr;
            }
            .pricing-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
            .api-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            }
        }
        @media (max-width: 480px) {
            .brand h1 {
                font-size: 1rem;
            }
            .nav-btn {
                font-size: 0.7rem;
                padding: 0.2rem 0.8rem;
            }
            .category-tag {
                font-size: 0.65rem;
                padding: 0.1rem 0.7rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="glass" style="margin-bottom:1rem;">

            <!-- ===== HEADER ===== -->
            <div class="header">
                <div class="brand">
                    <h1>🐍 python zone</h1>
                    <small>منصة البرمجيات والتطوير</small>
                </div>
                <div class="header-actions">
                    <button class="btn-icon" onclick="toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i></button>
                    <button class="btn-icon" onclick="showToast('👋 مرحباً بك في Py Zone')"><i class="fas fa-heart"></i></button>
                </div>
            </div>

            <!-- ===== NAV ===== -->
            <div class="nav-links">
                <button class="nav-btn active" onclick="filterContent('all')"><i class="fas fa-th"></i> الكل</button>
                <button class="nav-btn" onclick="filterContent('codes')"><i class="fas fa-code"></i> الأكواد</button>
                <button class="nav-btn" onclick="filterContent('tools')"><i class="fas fa-tools"></i> الأدوات</button>
                <button class="nav-btn" onclick="filterContent('bots')"><i class="fas fa-robot"></i> بوتات</button>
            </div>

            <!-- ===== CATEGORIES ===== -->
            <div class="categories glass">
                <span class="category-tag active" onclick="filterCategory('all')">الكل</span>
                <span class="category-tag" onclick="filterCategory('python')">🐍 بايثون</span>
                <span class="category-tag" onclick="filterCategory('telegram')">✈️ تليجرام</span>
                <span class="category-tag" onclick="filterCategory('security')">🛡️ أمن</span>
                <span class="category-tag" onclick="filterCategory('music')">🎵 موسيقى</span>
            </div>

            <!-- ===== CONTENT ===== -->
            <h3 style="color:#0f172a;margin:1rem 0 0.5rem 0;display:flex;align-items:center;gap:10px;">
                <i class="fas fa-fire" style="color:#eab308;"></i> الأكثر طلباً
            </h3>
            <div class="content-grid" id="contentGrid"></div>

            <!-- ===== PRICING ===== -->
            <div class="pricing-section glass" style="margin-top:1.5rem;padding:1.2rem 1.5rem;border-radius:28px;">
                <h3 style="color:#0f172a;margin-bottom:0.8rem;display:flex;align-items:center;gap:10px;">
                    <i class="fas fa-tags" style="color:#7c3aed;"></i> خطط التسعير
                </h3>
                <div class="pricing-grid" id="pricingGrid"></div>
            </div>

            <!-- ===== API ===== -->
            <div class="api-section glass" style="margin-top:1.5rem;padding:1.2rem 1.5rem;border-radius:28px;">
                <h3 style="color:#0f172a;margin-bottom:0.8rem;display:flex;align-items:center;gap:10px;">
                    <i class="fas fa-plug" style="color:#7c3aed;"></i> خدمات API
                </h3>
                <div class="api-grid" id="apiGrid"></div>
            </div>

            <!-- ===== FOOTER ===== -->
            <div class="footer">
                <div>By: <strong>@TopVeGa</strong></div>
                <div>جميع الحقوق محفوظة © 2015-2026</div>
            </div>

        </div>
    </div>

    <!-- ===== PRICING DETAIL MODAL ===== -->
    <div class="modal-overlay" id="pricingModal">
        <div class="modal">
            <button class="close-modal" onclick="closePricingModal()"><i class="fas fa-times"></i></button>
            <h2><i class="fas fa-crown"></i> <span id="pricingModalTitle">تفاصيل الخطة</span></h2>
            <div id="pricingModalBody"></div>
            <button class="pricing-btn" onclick="showToast('✅ تم اختيار الخطة! سيتم التواصل معك قريباً.')" style="width:100%;padding:0.8rem;font-size:1rem;margin-top:1rem;">
                <i class="fas fa-credit-card"></i> اشتراك
            </button>
        </div>
    </div>

    <!-- ===== API DETAIL MODAL ===== -->
    <div class="modal-overlay" id="apiModal">
        <div class="modal">
            <button class="close-modal" onclick="closeApiModal()"><i class="fas fa-times"></i></button>
            <h2><i class="fas fa-plug"></i> <span id="apiModalTitle">تفاصيل API</span></h2>
            <div id="apiModalBody"></div>
            <div class="pricing-grid" id="apiPricingGrid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:1rem;"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // ===== DATA =====
        // ============================================================
        const contentData = [
            { id: 1, title: 'سكربت استخراج جلسات', desc: 'استخراج جلسات بايروجرام بسهولة', icon: 'fa-key', category: 'telegram',
                type: 'scripts' },
            { id: 2, title: 'بوت موسيقى متكامل', desc: 'تشغيل وتحميل الأغاني من يوتيوب', icon: 'fa-music', category: 'music',
                type: 'bots' },
            { id: 3, title: 'أداة حماية سيرفرات', desc: 'حماية متقدمة من الاختراقات', icon: 'fa-shield-alt',
                category: 'security', type: 'tools' },
            { id: 4, title: 'مكتبة بايثون للـ API', desc: 'مكتبة متكاملة للتعامل مع APIs', icon: 'fa-plug', category: 'python',
                type: 'codes' },
            { id: 5, title: 'سكربت نقل أعضاء', desc: 'نقل أعضاء بين المجموعات', icon: 'fa-user-friends', category: 'telegram',
                type: 'scripts' },
            { id: 6, title: 'ملف حماية lua & php', desc: 'حماية متقدمة لمواقع الويب', icon: 'fa-file-code',
                category: 'security', type: 'tools' }
        ];

        const pricingData = [
            { name: 'أساسي', price: '1.5', desc: 'للمبتدئين', features: ['100 طلب/يوم', 'API أساسية'] },
            { name: 'قياسي', price: '5', desc: 'للمطورين', features: ['500 طلب/يوم', 'جميع APIs'] },
            { name: 'احترافي', price: '15', desc: 'الأكثر طلباً', features: ['2000 طلب/يوم', 'دعم VIP'] },
            { name: 'مؤسسي', price: '35', desc: 'للشركات', features: ['5000 طلب/يوم', 'دعم مخصص'] }
        ];

        const apiData = [
            { name: 'YouTube API', desc: 'جلب البيانات، بحث، تشغيل', icon: 'fab fa-youtube' },
            { name: 'Spotify API', desc: 'موسيقى، قوائم تشغيل', icon: 'fab fa-spotify' },
            { name: 'Telegram API', desc: 'بوتات، جلسات، تفاعلات', icon: 'fab fa-telegram' },
            { name: 'Media API', desc: 'رفع ومعالجة الميديا', icon: 'fas fa-cloud-upload-alt' }
        ];

        let currentFilter = 'all';
        let currentCategory = 'all';

        // ============================================================
        // ===== RENDER FUNCTIONS =====
        // ============================================================
        function renderContent() {
            const grid = document.getElementById('contentGrid');
            let filtered = contentData;
            if (currentFilter !== 'all') filtered = filtered.filter(item => item.type === currentFilter);
            if (currentCategory !== 'all') filtered = filtered.filter(item => item.category === currentCategory);

            if (filtered.length === 0) {
                grid.innerHTML =
                    `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:#64748b;">لا يوجد محتوى مطابق</div>`;
                return;
            }

            grid.innerHTML = filtered.map(item => `
                    <div class="content-card glass">
                        <div class="card-icon"><i class="fas ${item.icon}"></i></div>
                        <div class="card-title">${item.title}</div>
                        <div class="card-desc">${item.desc}</div>
                        <div class="card-actions">
                            <button onclick="showToast('⬇️ جاري تحميل: ${item.title}')"><i class="fas fa-download"></i> تحميل</button>
                            <button onclick="showToast('📋 تم نسخ: ${item.title}')"><i class="fas fa-copy"></i> نسخ</button>
                        </div>
                    </div>
                `).join('');
        }

        function renderPricing() {
            const grid = document.getElementById('pricingGrid');
            grid.innerHTML = pricingData.map((p, idx) => `
                    <div class="pricing-card glass ${idx === 2 ? 'popular' : ''}" onclick="openPricingModal(${idx})">
                        <div class="pricing-name">${p.name}</div>
                        <div class="pricing-price">${p.price}$ <small>/شهر</small></div>
                        <div class="pricing-desc" style="font-size:0.7rem;color:#64748b;">${p.desc}</div>
                        <button class="pricing-btn" onclick="event.stopPropagation();openPricingModal(${idx})">اختيار</button>
                    </div>
                `).join('');
        }

        function renderAPIs() {
            const grid = document.getElementById('apiGrid');
            grid.innerHTML = apiData.map((api, idx) => `
                    <div class="api-card" onclick="openApiModal(${idx})">
                        <i class="${api.icon}"></i>
                        <div class="api-name">${api.name}</div>
                        <div class="api-desc">${api.desc}</div>
                    </div>
                `).join('');
        }

        // ============================================================
        // ===== MODALS =====
        // ============================================================
        function openPricingModal(index) {
            const p = pricingData[index];
            document.getElementById('pricingModalTitle').textContent = p.name;
            document.getElementById('pricingModalBody').innerHTML = `
                    <div style="display:grid;gap:0.5rem;">
                        <div style="display:flex;justify-content:space-between;padding:0.4rem 0.8rem;background:rgba(248,250,252,0.4);border-radius:12px;">
                            <span>السعر</span><span style="font-weight:600;color:#7c3aed;">${p.price}$ / شهر</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;padding:0.4rem 0.8rem;background:rgba(248,250,252,0.4);border-radius:12px;">
                            <span>الوصف</span><span>${p.desc}</span>
                        </div>
                        ${p.features.map(f => `
                            <div style="display:flex;justify-content:space-between;padding:0.4rem 0.8rem;background:rgba(248,250,252,0.4);border-radius:12px;">
                                <span>الميزة</span><span>${f}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            document.getElementById('pricingModal').classList.add('show');
        }

        function closePricingModal() {
            document.getElementById('pricingModal').classList.remove('show');
        }

        function openApiModal(index) {
            const api = apiData[index];
            document.getElementById('apiModalTitle').textContent = api.name;
            document.getElementById('apiModalBody').innerHTML = `
                    <p><strong>الوصف:</strong> ${api.desc}</p>
                    <p><strong>الحالة:</strong> <span style="color:#22c55e;">متاح</span></p>
                `;
            document.getElementById('apiPricingGrid').innerHTML = `
                    <div class="pricing-card glass" onclick="showToast('✅ تم اختيار خطة ستارت لـ ${api.name}')">
                        <div class="pricing-name">ستارت</div>
                        <div class="pricing-price">2$ <small>/شهر</small></div>
                    </div>
                    <div class="pricing-card glass" onclick="showToast('✅ تم اختيار خطة برو لـ ${api.name}')">
                        <div class="pricing-name">برو</div>
                        <div class="pricing-price">8$ <small>/شهر</small></div>
                    </div>
                    <div class="pricing-card glass popular" onclick="showToast('✅ تم اختيار خطة بريميوم لـ ${api.name}')">
                        <div class="pricing-name">بريميوم</div>
                        <div class="pricing-price">20$ <small>/شهر</small></div>
                    </div>
                `;
            document.getElementById('apiModal').classList.add('show');
        }

        function closeApiModal() {
            document.getElementById('apiModal').classList.remove('show');
        }

        // ============================================================
        // ===== FILTERS =====
        // ============================================================
        function filterContent(type) {
            currentFilter = type;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach((b, i) => {
                if ((type === 'all' && i === 0) || (type === 'codes' && i === 1) ||
                    (type === 'tools' && i === 2) || (type === 'bots' && i === 3)) {
                    b.classList.add('active');
                }
            });
            renderContent();
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-tag').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.category-tag').forEach(t => {
                const text = t.textContent.trim();
                if ((category === 'all' && text === 'الكل') ||
                    (category === 'python' && text.includes('بايثون')) ||
                    (category === 'telegram' && text.includes('تليجرام')) ||
                    (category === 'security' && text.includes('أمن')) ||
                    (category === 'music' && text.includes('موسيقى'))) {
                    t.classList.add('active');
                }
            });
            renderContent();
        }

        // ============================================================
        // ===== THEME =====
        // ============================================================
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('themeIcon');
            icon.className = document.body.classList.contains('dark-mode') ? 'fas fa-sun' : 'fas fa-moon';
        }

        // ============================================================
        // ===== TOAST =====
        // ============================================================
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============================================================
        // ===== CLOSE MODALS ON OVERLAY CLICK =====
        // ============================================================
        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('show');
            });
        });

        // ============================================================
        // ===== INIT =====
        // ============================================================
        renderContent();
        renderPricing();
        renderAPIs();

        // Check for saved theme
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeIcon').className = 'fas fa-sun';
        }

        // Save theme preference
        document.addEventListener('DOMContentLoaded', function() {
            const observer = new MutationObserver(function() {
                localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
            });
            observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
        });

        console.log('🚀 Py Zone | منصة خدمات فيجا');
        console.log('📌 @TopVeGa');
    </script>
</body>
</html>
